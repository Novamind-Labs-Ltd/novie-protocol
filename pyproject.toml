[project]
name = "novie-protocol"
version = "0.1.0"
description = "Novie 平台与专家 Agent 之间的共享协议层（contracts / services / agents / events）。"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Proprietary" }
authors = [{ name = "Novie" }]
dependencies = [
    "pydantic>=2.7",
    "typing-extensions>=4.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novie_protocol"]
